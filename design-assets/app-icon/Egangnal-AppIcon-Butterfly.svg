<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAEFF5"/>
    </linearGradient>
    <radialGradient id="sheen" cx="512" cy="60" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset=".72" stop-color="#0B1B2E" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B1B2E" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset=".3" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".8" stop-color="#0B1B2E" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B1B2E" stop-opacity=".08"/>
    </linearGradient>
    <!-- Wide ambient shadow plus a tight contact shadow, as in the macOS icon template. -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer result="ambient"><feFuncA type="linear" slope=".26"/></feComponentTransfer>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2"/>
      <feComponentTransfer result="contact"><feFuncA type="linear" slope=".14"/></feComponentTransfer>
      <feMerge><feMergeNode in="ambient"/><feMergeNode in="contact"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="135%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="9"/>
      <feComponentTransfer result="shadow"><feFuncA type="linear" slope=".2"/></feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Plate follows the macOS grid: 824 x 824 at a 100 px inset, leaving room for the shadow. -->
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#plate)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#sheen)"/>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#base)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.9" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="none" stroke="#0B1B2E" stroke-opacity=".1" stroke-width="2"/>

  <!-- The butterfly artwork is unchanged; its bounding box (192..832, 261..690) is scaled and centred on the canvas. -->
  <g transform="translate(512 512) scale(0.9) translate(-512 -476)" filter="url(#lift)">
    <g fill="none" stroke="#17212B" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
      <!-- Short antennae stop well inside the icon's visual bounds. -->
      <path d="M 498 372 C 492 334, 480 298, 460 270" stroke-width="18"/>
      <path d="M 526 372 C 532 334, 544 298, 564 270" stroke-width="18"/>

      <!-- Upper wings -->
      <path d="M 486 410 C 430 294, 282 260, 220 350 C 166 430, 250 516, 466 466"/>
      <path d="M 538 410 C 594 294, 742 260, 804 350 C 858 430, 774 516, 558 466"/>

      <!-- Lower wings -->
      <path d="M 470 466 C 326 486, 246 560, 286 650 C 322 732, 430 624, 496 496"/>
      <path d="M 554 466 C 698 486, 778 560, 738 650 C 702 732, 594 624, 528 496"/>
    </g>

    <circle cx="512" cy="388" r="28" fill="#17212B"/>
    <!-- The connector remains fully inside the wing silhouette. -->
    <rect x="490" y="402" width="44" height="128" rx="22" fill="#17212B"/>
  </g>
</svg>
