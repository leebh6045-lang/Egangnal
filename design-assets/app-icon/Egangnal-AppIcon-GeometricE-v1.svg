<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="128" y1="96" x2="896" y2="936" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#F7FAFD"/>
      <stop offset="1" stop-color="#EEF3F8"/>
    </linearGradient>
    <linearGradient id="blue" x1="252" y1="286" x2="744" y2="738" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CB2F8"/>
      <stop offset="0.55" stop-color="#3D93EA"/>
      <stop offset="1" stop-color="#2777D4"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#203349" flood-opacity="0.20"/>
    </filter>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2365A8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- macOS 风格圆角图标底板 -->
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#tile)" filter="url(#tileShadow)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="202.5" fill="none" stroke="#CFDAE6" stroke-width="3"/>

  <!-- 几何折线 E：四段共用线宽与圆角，形成稳定、清晰的单一标志 -->
  <g fill="none" stroke="url(#blue)" stroke-width="72" stroke-linecap="round" stroke-linejoin="round" filter="url(#markShadow)">
    <path d="M 742 336 H 282 V 688 H 742"/>
    <path d="M 282 512 H 642"/>
  </g>

</svg>
