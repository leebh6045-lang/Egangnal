<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="132" y1="104" x2="892" y2="936" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#F7FAFD"/>
      <stop offset="1" stop-color="#EEF3F8"/>
    </linearGradient>
    <linearGradient id="blue" x1="250" y1="310" x2="500" y2="710" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#54A8F4"/>
      <stop offset="1" stop-color="#2F82DE"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#203349" flood-opacity="0.20"/>
    </filter>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1B2A3A" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- macOS 图标底板 -->
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#paper)" filter="url(#tileShadow)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="202.5" fill="none" stroke="#CFDAE6" stroke-width="3"/>

  <!-- 蓝色 n/E：顶部与右侧 u 共用同一条水平基准线 -->
  <path
    d="M 256 690 L 256 350 L 512 350"
    fill="none"
    stroke="url(#blue)"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#markShadow)"
  />

  <!-- 蓝色 E 的中横与底横保持水平、等粗、规则对齐 -->
  <path
    d="M 256 520 L 438 520"
    fill="none"
    stroke="url(#blue)"
    stroke-width="34"
    stroke-linecap="round"
  />
  <path
    d="M 256 690 L 468 690"
    fill="none"
    stroke="url(#blue)"
    stroke-width="34"
    stroke-linecap="round"
  />

  <!-- 左页内容纹理使用平直且等距的短线 -->
  <g fill="none" stroke="#A6B1BE" stroke-width="18" stroke-linecap="round" opacity="0.92">
    <path d="M 320 410 L 404 410"/>
    <path d="M 320 458 L 424 458"/>
    <path d="M 320 598 L 404 598"/>
    <path d="M 320 646 L 424 646"/>
  </g>

  <!-- 深灰色 u：顶部 y=350、底部 y=690，与蓝色 E 严格平齐 -->
  <path
    d="M 512 350 L 512 610 C 512 662 560 690 635 690 C 710 690 758 662 758 610 L 758 350"
    fill="none"
    stroke="#33404F"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#markShadow)"
  />
</svg>
