<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="180" y1="120" x2="844" y2="904" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16273B"/>
      <stop offset="0.56" stop-color="#0D1724"/>
      <stop offset="1" stop-color="#08111C"/>
    </linearGradient>
    <linearGradient id="accent" x1="392" y1="312" x2="650" y2="616" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6BA3FF"/>
      <stop offset="1" stop-color="#3978E8"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020812" flood-opacity="0.42"/>
    </filter>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020812" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- Transparent outer canvas leaves macOS-style breathing room around the tile. -->
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#background)" filter="url(#tileShadow)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="202.5" fill="none" stroke="#7EA2CC" stroke-opacity="0.18" stroke-width="3"/>

  <!-- A quiet internal frame echoes the app's grid-and-panel visual language. -->
  <rect x="147" y="147" width="730" height="730" rx="150" fill="none" stroke="#90A7C0" stroke-opacity="0.07" stroke-width="2"/>

  <!-- Abstract E: the starting state of Egangnal. -->
  <g fill="#F4F7FB" filter="url(#markShadow)">
    <rect x="232" y="278" width="88" height="468" rx="44"/>
    <rect x="268" y="278" width="190" height="80" rx="40"/>
    <rect x="268" y="472" width="158" height="80" rx="40"/>
    <rect x="268" y="666" width="190" height="80" rx="40"/>
  </g>

  <!-- Abstract L: the Language destination. -->
  <g fill="#F4F7FB" filter="url(#markShadow)">
    <rect x="704" y="278" width="88" height="468" rx="44"/>
    <rect x="566" y="666" width="226" height="80" rx="40"/>
  </g>

  <!-- Two opposing trajectories express letter reordering rather than translation. -->
  <g fill="none" stroke="url(#accent)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#markShadow)">
    <path d="M 416 400 C 476 330, 568 330, 632 398"/>
    <path d="M 608 566 C 548 636, 456 636, 392 568"/>
  </g>
  <g fill="#4D8DFF" filter="url(#markShadow)">
    <path d="M 616 356 L 674 404 L 610 438 Z"/>
    <path d="M 408 526 L 350 574 L 414 608 Z"/>
  </g>

  <!-- One warm node hints at retained learning without turning the mark into a reward badge. -->
  <circle cx="512" cy="484" r="17" fill="#FFB528"/>
</svg>
