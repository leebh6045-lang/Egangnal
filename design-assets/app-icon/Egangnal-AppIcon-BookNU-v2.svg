<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="132" y1="104" x2="892" y2="936" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#F7FAFD"/>
      <stop offset="1" stop-color="#EEF3F8"/>
    </linearGradient>
    <linearGradient id="blue" x1="248" y1="294" x2="512" y2="718" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#54A8F4"/>
      <stop offset="1" stop-color="#2F82DE"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#203349" flood-opacity="0.20"/>
    </filter>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1B2A3A" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- macOS 图标底板 -->
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#paper)" filter="url(#tileShadow)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="202.5" fill="none" stroke="#CFDAE6" stroke-width="3"/>

  <!-- 左侧 n 的外轮廓，同时构成蓝色 E 的竖线和顶部横线 -->
  <path
    d="M 256 698 L 256 334 C 332 294 430 292 512 368"
    fill="none"
    stroke="url(#blue)"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#markShadow)"
  />

  <!-- 蓝色 E 的中部和底部横线直接连接左侧竖线 -->
  <path
    d="M 256 516 C 318 538 382 534 444 512"
    fill="none"
    stroke="url(#blue)"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#markShadow)"
  />
  <path
    d="M 256 698 C 324 722 402 724 472 696"
    fill="none"
    stroke="url(#blue)"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#markShadow)"
  />

  <!-- 左页的少量内容纹理，小尺寸版本可省略 -->
  <g fill="none" stroke="#A6B1BE" stroke-width="19" stroke-linecap="round" opacity="0.92">
    <path d="M 320 392 C 350 384 380 386 410 397"/>
    <path d="M 320 448 C 350 458 380 458 408 448"/>
    <path d="M 320 594 C 352 584 383 586 416 598"/>
    <path d="M 320 646 C 354 656 388 654 422 642"/>
  </g>

  <!-- n 与 u 共用的中央竖线，作为书本装订线 -->
  <path
    d="M 512 368 L 512 690"
    fill="none"
    stroke="#33404F"
    stroke-width="36"
    stroke-linecap="round"
  />

  <!-- 右侧 u 保持极简，底部弧线形成打开的右页 -->
  <path
    d="M 758 330 L 758 650 C 694 726 578 748 512 690"
    fill="none"
    stroke="#33404F"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#markShadow)"
  />

  <!-- 中轴底端的小幅延伸增强书脊结构 -->
  <path
    d="M 512 690 L 512 738"
    fill="none"
    stroke="#33404F"
    stroke-width="28"
    stroke-linecap="round"
  />
</svg>
